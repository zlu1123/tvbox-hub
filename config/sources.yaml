# ============================================================
#  TVBox 源 —— 唯一的配置入口
#  改完这个文件，跑 `python3 scripts/build.py` 就会重新生成配置
# ============================================================

meta:
  name: "我的 TVBox 源"
  # 生成物版本号，每次 build 会自动 +1 并写入 index.json
  version: "1.0.0"

# ------------------------------------------------------------
# 直播源
# ------------------------------------------------------------
live:
  enabled: true

  # 上游 M3U / TXT 清单，**按顺序抓取合并**。
  # 顺序 = 优先级：同一个台在多个上游都有时，排前面的上游的线路会被优先写进
  # live.txt / live.m3u（电视上只认第一个），后面的当作备用线路。
  upstreams:
    # ① 央视主力：移动 CDN（gslbserv.itv.cmvideo.cn）官方转码流。
    #    全国可达、没有广告跳转，是目前最稳的央视来源。
    #    这个文件里还混了 NewTV / iHOT / SiTV 这些点播品牌频道，用 groups 只留央视组。
    - name: fanmingming-cctv
      url: "https://cdn.jsdelivr.net/gh/fanmingming/live@main/tv/m3u/itv.m3u"
      groups: ["央视"]
      # 一个台给了 普通 / 50FPS / HEVC 三个版本，电视是 Android 6 的老 SoC，
      # 留 HEVC 和 50FPS 只会让播放器切到解不动的流上黑屏。
      exclude:
        - "\\d+\\s*FPS|HEVC|HDR|Multi-Audio"
      max_lines: 2

    # ② 卫视主力：Guovin/iptv-api 的 gd 分支，跑在 GitHub Actions 上，
    #    每天自动测速重排，所以线路是「此刻最快」的，覆盖 43 个卫视。
    #    一个台会给十几条备用线，max_lines 截断到 2 条，避免探活时间爆炸。
    - name: guovin
      url: "https://cdn.jsdelivr.net/gh/Guovin/iptv-api@gd/output/result.m3u"
      groups: ["📺央视频道", "📡卫视频道"]
      max_lines: 2

    # ③ 地方台来源。iptv-org 的央视那批全部指向同一个广告跳转农场
    #    （74.91.26.218 → 142.54.178.42/applive/mkt.m3u8，mkt = marketing），
    #    所以这里把整批广告线路按 IP 干掉，只留它真正在转播的地方台。
    - name: iptv-org-cn
      url: "https://iptv-org.github.io/iptv/countries/cn.m3u"
      # 它的清单里有一百多个英文名的县市级小台，全收进来电视上就是一屏英文。
      # only_mapped = 只收下面 name_map 里人工给了中文名的台。
      only_mapped: true
      exclude:
        - "74\\.91\\.26\\.218|69\\.30\\.245\\.50|142\\.54\\.178\\.42"
        - "go\\.bkpcp\\.top|applive|mkt\\.m3u8"
      max_lines: 2

    # ④ 补充源（suxuang/myIPTV）。它的央视线路同样是代理农场，但混着几个
    #    官方/干净源，值得捞一捞。用 include 只挑可信的台，其余一概不要。
    - name: myiptv
      url: "https://cdn.jsdelivr.net/gh/suxuang/myIPTV@main/ipv4.m3u"
      include:
        - "东方卫视"                 # bestv.cn 官方源，实测可达
      max_lines: 1

    # 你自己的源（比如运营商 IPTV 抓包得到的 m3u、或你自己维护的 txt 清单）。
    # trust: true 表示跳过上面的 include/exclude 白名单，里面有什么就收什么。
    # 把这些文件放进 config/ 目录，用相对路径引用即可。
    # - name: my-own
    #   url: "https://raw.githubusercontent.com/<你>/tvbox-hub/main/config/my_live.m3u"
    #   trust: true

  # 频道筛选。留空 = 全收，靠探活来淘汰不能播的。
  # 之前的教训：按台名白名单筛出来的 CCTV 系 15 个台，直连实测一个都播不了
  # （那些流只在境外可达），白名单只会把真正能看的频道挤掉。
  include: []

  # 命中以下正则的条目直接丢弃。规则会同时匹配「台名」和「线路 URL」，
  # 所以既能按台名过滤，也能整批拉黑一批主机。
  exclude:
    - "Not 24/7"                 # 不是全天播的，半天黑屏
    - "Geo-blocked"
    - "购物|Shopping|HomePlus|Fengshang"
    - "CCTV\\+\\s?\\d"           # CCTV+ 是海外商业频道，不是央视
    - "VoA|Voice of America|BRICS"
    - "ABN|Angel TV|Bread TV|Ando TV|High Channel TV"
    - "支持作者|更新时间|测试|备用|请勿|公告"   # 源作者塞进来的广告位/通知位

    # —— 广告农场（实测证据）——
    # 这批主机把几十个台名全指到同一个跳转池，随机跳到
    # :88/applive/xxx.m3u8（mkt=广告位 / yss=一条共用流），
    # 点开不是广告就是和台名对不上的画面。实测同一 URL 两次请求会
    # 分别拿到真流和广告流，所以只能整批拉黑，不能靠探活碰运气。
    - "://(?:74\\.91\\.26\\.218|69\\.30\\.245\\.|69\\.197\\.|38\\.75\\.136\\.137|63\\.141\\.230\\.178|207\\.56\\.13\\.146|173\\.208\\.234\\.146|107\\.150\\.60\\.122|142\\.54\\.(?:162|168|178)\\.)"

    # —— 不是直播的伪线路 ——
    # 把一段短视频 mp4 当「卫视直播」挂上来，播几秒就循环/结束。
    - "kwimgs\\.com|\\.mp4($|\\?)"

  # 上游清单里整个分组不要的，写分组名（对应 m3u 的 group-title）
  exclude_groups:
    - Religious
    - Shopping

  # ----------------------------------------------------------
  # 英文台名 → 中文台名
  # iptv-org 上游用的是英文名，不映射的话「卫视」这种规则永远匹配不上。
  # 想加地方台，在这里加一行，再把台名对应的关键词加进 include 即可。
  # ----------------------------------------------------------
  name_map:
    # —— 央视付费/特色频道 ——
    "CCTV-Billiards": "央视台球"
    "CCTV-Golf & Tennis": "央视高尔夫网球"
    "CCTV-Storm Music": "风云音乐"
    "CCTV-Storm Theater": "风云剧场"
    "CCTV-Storm Football": "风云足球"
    "CCTV-The First Theater": "第一剧场"
    "CCTV-Nostalgia Theater": "怀旧剧场"
    "CCTV-Weapon & Technology": "央视兵器科技"
    "CCTV-Women's Fashion": "央视女性时尚"
    "CCTV-World Geography": "央视世界地理"
    "CCTV-Culture of Quality": "央视精品"
    "CCTV-Health": "央视卫生健康"
    "CCTV-4K": "CCTV-4K 超高清"
    "CCTV-8K": "CCTV-8K 超高清"
    # —— 教育台 ——
    "CETV-1": "中国教育一台"
    "CETV-2": "中国教育二台"
    # —— 省级卫视 ——
    "Anhui TV": "安徽卫视"
    "Beijing Satellite TV": "北京卫视"
    "Bingtuan Satellite TV": "兵团卫视"
    "Dragon TV International": "东方卫视国际"
    "Guangdong Satellite TV": "广东卫视"
    "Guizhou TV": "贵州卫视"
    "Hebei TV": "河北卫视"
    "Heilongjiang TV": "黑龙江卫视"
    "Hunan TV": "湖南卫视"
    "Jiangsu Satellite TV": "江苏卫视"
    "Jiangxi TV": "江西卫视"
    "Liaoning TV": "辽宁卫视"
    "Nei Monggol TV": "内蒙古卫视"
    "Ningxia Satellite Channel": "宁夏卫视"
    "Qinghai TV": "青海卫视"
    "Shandong Satellite TV": "山东卫视"
    "Shenzhen Satellite TV": "深圳卫视"
    "Sichuan Satellite TV": "四川卫视"
    "Tianjin TV": "天津卫视"
    "Xinjiang TV 1": "新疆卫视"
    "Xizang TV Chinese": "西藏卫视"
    "Yanbian Satellite TV": "延边卫视"
    "Yunnan Satellite TV": "云南卫视"
    "Zhejiang Satellite TV": "浙江卫视"
    # —— 地方台（探活筛出来的能播的）——
    "Chaozhou Public Channel": "潮州公共频道"
    "Chifeng Comprehensive News Chanel": "赤峰综合新闻频道"
    "Dongguan Comprehensive News Channel": "东莞综合新闻频道"
    "Guangxi Variety & Travel Channel": "广西综艺旅游频道"
    "Guangzhou TV": "广州台"
    "Harbin Comprehensive News Channel": "哈尔滨新闻综合频道"
    "Harbin Movie Channel": "哈尔滨电影频道"
    "Hunan Economy Channel": "湖南经视频道"
    "Jingmen Comprehensive News Channel": "荆门综合新闻频道"
    "Kangba TV": "康巴卫视"
    "Lanzhou Comprehensive News Channel": "兰州新闻综合频道"
    "Lanzhou Culture & Tourism Channel": "兰州文旅频道"
    "Xizang TV Tibetan": "西藏卫视藏语"
    "Yichang Sanxia General Channel": "宜昌三峡综合频道"
    "Yichang Sanxia Travel & Life Channel": "宜昌三峡旅游生活"
    "Zhejiang International Channel": "浙江国际频道"

  # 频道名清洗后作为唯一键，同一频道多个地址会合并成多线路（TVBox 自动容错切换）
  max_lines_per_channel: 4

  # 探活：真正去拉清单 + 拉第一个视频分片，死链直接不写进配置
  probe:
    enabled: true
    timeout: 10           # 单个流超时（秒）
    # 这些免费流多半跑在境外小 VPS 上，并发一高就直接 reset 连接，
    # 32 并发时误判成死链的比真死的还多。8 并发慢一点但测得准。
    workers: 8
    retries: 1

# ------------------------------------------------------------
# 影视源（点播）—— TVBox / 影视仓 里搜电影电视剧用的就是这里
#
# 只认一种格式：能返回「苹果CMS v10」JSON 的接口地址。
# 现在是空的，所以电视上只有直播、没有点播。
# ------------------------------------------------------------
vod:
  sites: []

  # ===== 加一个影视接口：照抄下面这段，取消注释，改 api 就行 =====
  #
  # - key: "my_vod"                  # 随便起，不能和别的重复
  #   name: "影视"                    # 电视上显示的名字
  #   type: 4                        # 固定 4 = 标准苹果CMS接口
  #   api: "https://xxx.com/api.php/provide/vod/"
  #   searchable: 1                  # 允许搜索
  #   quickSearch: 1                 # 参与首页快捷搜索
  #   filterable: 1                  # 允许按分类筛选
  #   ext: ""
  #
  # 加完跑一次 ./scripts/refresh.sh，电视上刷新配置就能搜片了。

# ------------------------------------------------------------
# 播放器高级项（一般不用动）
# ------------------------------------------------------------
player:
  # 解析器：留空表示不启用网页解析
  parses: []

  # 支持的 flag，决定播放器用哪套播放核心
  flags:
    - youku
    - qq
    - iqiyi
    - qiyi
    - letv
    - sohu
    - tudou
    - pptv
    - mgtv
    - wasu
    - bilibili

  # 硬解码优先的 ijk 选项组
  ijk:
    - group: "软解码"
      options:
        - category: 4
          name: "opensles"
          value: "0"
        - category: 4
          name: "framedrop"
          value: "1"
    - group: "硬解码"
      options:
        - category: 4
          name: "mediacodec"
          value: "1"
        - category: 4
          name: "framedrop"
          value: "1"

  # DNS over HTTPS，防止运营商 DNS 污染导致源打不开
  doh:
    - name: "Google"
      url: "https://dns.google/dns-query"
      ips: ["8.8.4.4", "8.8.8.8"]
    - name: "AliDNS"
      url: "https://dns.alidns.com/dns-query"
      ips: ["223.5.5.5", "223.6.6.6"]
